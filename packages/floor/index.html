<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenFloor — Live Auction</title>
    <meta
      name="description"
      content="A WebMCP-native auction house. Your agent bids, you set the limits, everything is on the record."
    />
    <!--
      The WebMCP origin-trial token is injected here at serve time from the
      ORIGIN_TRIAL_TOKEN environment variable, so it is never baked into the
      bundle — a token is tied to one exact origin, and the same bundle is
      served from several. Writing the example tag out in full here meant
      View Source showed a meta tag reading content="TOKEN", which looks like
      a broken token to anyone inspecting the page.
      For local development use chrome://flags/#enable-webmcp-testing instead.
    -->
  </head>
  <body>
    <div id="root"></div>
    <!-- Runtime configuration, generated by the server from its environment.
         Must load BEFORE the app bundle. Absent under `vite dev`, where the
         app falls back to import.meta.env. -->
    <script src="/config.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
